alan: elektronik
ozet: "Elektronik kutunun uretim maliyeti asagidan yukari yeniden modellendi. Kutu su bilesenlerden olusur: MPPT,\
  \ BMS elektronigi, A'da izoleli sebeke inverteri, B'de DC cikislar ve istege bagli inverter, dis kasa. Fiyatlar\
  \ Eylul 2026 (1 USD = 48.92 TRY; 1 EUR = 1.139 USD, EURTRY/USDTRY'den turetildi).\nKapsam: pil hucreleri ve pil\
  \ mekanigi (tutucu, bara, isil bariyer) pil ajanindadir. Dis kasa icindeki pil bolmesinin hacmi burada.\nToplayici\
  \ yalnizca formul ciktilarini (el_f_*) toplar. Parametrelerdeki maliyet_sinifi yalnizca etikettir; birim fiyatlar\
  \ 'teknik' olarak isaretlendi.\n\nRevizyonda degisenler:\n- Inverter topolojisi: 2 fazli flyback birakildi. Yerine\
  \ izoleli DC-DC + 400 V ara devre + PWM H koprusu.\n- Olcekleme P_panel x n_panel_per_box ile yapiliyor.\n- urun_sabit\
  \ iki hacim rejiminde veriliyor.\n- Dusuk hacimde test istasyonu amortismani (zaman sinifi) eklendi.\n- Garanti\
  \ ve eksik adet kalemleri (ambalaj, AC kablo, hurda, MOQ, SMT kurulum, WEEE, bulut) toplama girdi.\n- Yeni fiziksel\
  \ sinirlar: C-rate, SELV tek ariza kosulu, 30-35 V islak ortam siniri.\n\nSONUC — kutu uretim maliyeti, Si + sarimli\
  \ manyetik, urun_sabit haric, talep 3,000 kutu/yil:\n- A (Almanya, 800 VA): 50 W 1.84 $/W (92 $); 200 W 0.51;\
  \ 500 W 0.25; 800 W 0.19 (151 $); 2000 W 0.105 $/W.\n- B, inverterli: 200 W 0.43 $/W; 800 W 0.15 $/W.\n- B, inverter\
  \ yok: 200 W 0.34 $/W (67 $); 800 W 0.12 $/W.\n- urun_sabit (NRE + sertifika + kalip + CRA + UN 38.3) varyant\
  \ basina A'da ~0.57-0.62 M$, B'de ~0.29-0.34 M$. Kutuya etkisi A-800 icin:\n  - talep sinirli (15 bin kutu/5 yil):\
  \ +0.050 $/W\n  - pil hatti sinirli (1 hat, 20 Wh hucre, 1,786 kutu/yil): +0.084 $/W\n  - gecerli olan, ikisinden\
  \ buyuk olandir.\n\nBULGULAR\n1) H4'un dogrulugu guce gore degisir. Guc katinin elektronik BOM icindeki payi (A,\
  \ Si): 50 W'ta %35, 200 W'ta %40, 500 W'ta %50, 800 W'ta %59, 2000 W'ta %71. Termal ve dolgu dahil edilip tum\
  \ kutuya bolununce: %22, %27, %35, %43, %51. Inverteri olmayan B'de ≤200 W icin %16-21.\n   - Hukum: H4, ≤200-300\
  \ W'ta yanlis; platform gucunde (≥500-800 W) elektronik icin buyuk olcude dogru.\n   - Manyetiklerin payi, firma\
  \ ici maliyetle, elektronik BOM'un %7-12'si, kutunun %4-6'si. GaN + planar ile bu pay %1-6'ya iner.\n2) GaN karari\
  \ belirsiz.\n   - 800 W'ta GaN primi, K_R'ye gore -0.5 / +21 / +47 $ (K_R = 3 / 8 / 14 $·mΩ).\n   - 0.8 puanlik\
  \ verim kazancinin iskontolu (%8, 10 yil) degeri Almanya fiyatiyla (BDEW 37.0 ct/kWh) 18 $, Turkiye'de ~3 $.\n\
  \   - Sert anahtarlamada 400 kHz GaN, 100 kHz Si'den verimli olmayabilir: Qoss·V·f kaybi GaN'da 0.92 W, Si'de\
  \ 0.45 W.\n   - Ilk nesil icin Si oneriliyor. GaN, 10 bin adetlik teklif alinip ayni kartta verim olculdukten\
  \ sonra degerlendirilmeli.\n3) Hacim ve urun_sabit:\n   - 14s zorunlulugu en kucuk paketi 14·E_cell yapar. Bu\
  \ yuzden kucuk kutuda pil hattinin kutu adedi 10.7 bin/yil'da doyar.\n   - Kutu adedi = min(talep, pil hatti).\
  \ Kucuk kutuda urun_sabit baskin: A-50'de 0.76 $/W.\n4) Panel boyutu: 800 W kutuda 50 W'lik 16 panel kullanilirsa\
  \ panel basina MPPT ile maliyet 0.27 $/W, 400 W'lik 2 panelle 0.19 $/W. Kucuk panelde panel basina konnektor ve\
  \ kanal maliyeti baskin. Kanal basina 300-500 W gruplanmali; en iyisi P_panel ≥ 200 W.\n5) SELV:\n   - DVC-A siniri\
  \ kuru ortamda 60 V, islak ortamda 35 V (IEC 62109-1 Tablo 6; test raporu ve IEC TS 62257-9-8 dogruladi).\n  \
  \ - Kurulum tarafinda IEC 60364-4-41 414.4.5'e gore kuru olmayan kosulda 30 V DC.\n   - 28-55 V'tan 230 V sebekeye\
  \ 6.5-13 katlik yukseltme gerekir; izolasyon bu oran yuzunden zaten sart. SELV'in ek bedeli yalnizca guclendirilmis\
  \ yalitim, ~1-2 $/kutu.\n   - Buck-boost MPPT'de tek ariza durumunda baranin 60 V'u gecmemesi icin bagimsiz OVP\
  \ gerekir.\n6) Termal ve pil:\n   - A-800'de ~63 W kayip atilmali; bunun icin ~0.35 m² yuzey gerekir.\n   - Na-ion\
  \ hucre 0-45 °C'de en fazla 0.5C, -10 ile 0 °C arasinda en fazla 0.2C ile sarj edilebilir (datasheet). Bu durumda\
  \ E_batt ≥ 2·P_box olmali, yoksa PV kirpilir.\n7) H6: Dusuk hacimde test maliyetini test suresi degil bos ekipmanin\
  \ amortismani belirler. A'da bu 7.5 $/kutu, test iscilligi 0.3 $. Kurum ici EMC/iklim laboratuvari 17-28 $/kutu\
  \ eder; dis kaynak ~2 $/kutu.\n8) Bekleme tuketimi yalnizca gece icin sayildi (~%55 pay): A 2 W / 200 W'ta yillik\
  \ uretimin %4.8'i.\n\nEN BUYUK BELIRSIZLIKLER (hepsi 'tahmin'):\n- Sertifika ve NRE\n- Sabit elektronik: AC arayuzu\
  \ 10 $, DC cikislar 12 $\n- GaN hacim fiyati\n- Test ekipmani yatirimi (capex)\n- Talep\n- AB Pil Tuzugu esikleri\
  \ (hafizadan)\nToplamlarda belirsizlik ±%30-50, urun_sabit'te 3 kat."
