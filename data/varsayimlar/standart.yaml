  ad: Modul azami asiri akim koruma degeri / Isc
  birim: '-'
  deger: 2
  alt: 1.5
  ust: 3
  kaynak: Tahmin (ticari veri sayfalarindaki 'max series fuse'/Isc oranlarina benzetme)
  kaynak_turu: tahmin
  kaynak_alintisi: '-'
  kaynak_tarihi: 2026-09
  guven: dusuk
  maliyet_sinifi: teknik
  olcek: urun
