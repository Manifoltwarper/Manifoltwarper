alan: standart
ozet: "Standartlar urunun elektrik mimarisini fiilen belirliyor. Bu revizyonda iki denetcinin bulgularinin cogunu\
  \ kaynaktan kendim kontrol ettim ve uyguladim. Iki onemli hata duzeltildi: SBESS/2 kWh baglantisi ve hava tasimasi\
  \ mantigi.\n\n(1) K6 dogru ama eksik. 60 V, IEC 60364-7-712:2017 madde 712.414.101'deki PV SELV/PELV siniridir.\
  \ Sinir U_OC_MAX'a uygulanir; soguk hava dahildir. Hesap K_U = 1+(alfa/100)(T_min-25) ile yapilir; alfa beyan\
  \ edilmemisse K_U = 1,2 alinir.\n- 60 V, dis ortamda dokunma siniri degildir. IEC 60364-4-41 madde 414.4.5'e gore\
  \ kuru olmayan kosulda sinir 30 V DC'dir; IEC 62109-1 DVC-A islak konum siniri 35 V'tur.\n- SELV, 414.1.1 geregi\
  \ diger devrelerden koruyucu ayirma ister. Sebeke veya AC devresi olmayan yalniz-DC urunde ise pil kendisi SELV\
  \ kaynagi sayilir (414.3.3), dolayisiyla trafo gerekmez.\n- SELV'in kullaniciya asil kazanci konnektorlerde. 712.526.101'deki\
  \ 'anahtar veya aletle ayrilan konnektor' sarti SELV kurulumda aranmaz, bu da kullanicinin kendi kurmasini kolaylastirir.\
  \ Buna karsin 35 V ustundeki her kurulumda konnektor Class II ve cift hareketle ayrilan kilitli tipte olmalidir\
  \ (712.526.1).\n- 60 V'u gecen dizilerde yalitim izleme (IMD) zorunludur. 60 V ve altinda standart metni belirsiz.\n\
  \n(2) Class III icin sinirlar: IEC 61730-1:2016 madde 4.4.1 (resmi onizlemede goruldu) modul basina STC'de Voc\
  \ <= 35 V, Isc <= 8 A ve <= 240 W diyor.\n- UL ozetine gore bu sinirlar seri/paralel kombinasyonlara da uygulanir.\
  \ Pil gibi baska bir kaynakla paralel kullanimda geri besleme ve asiri gerilim korumasi sarttir.\n- Islak DVC-A\
  \ veya Avusturya siniri (U_OC_MAX <= 35 V) da istenirse N_s <= 42 olur ve ulasilabilen guc 195-208 W'tir.\n- 8\
  \ A siniri wafer boyutunu degil, hucre ALANINI sinirlar (<= ~202 cm2). 182-210 mm wafer, yarim veya ucte bir kesimle\
  \ bu sinira uyar.\n\n(3) Almanya fisli PV sinirlari: invertor 800 VA; toplam modul gucu Schuko fisle 960 Wp, ozel\
  \ fisle 2000 Wp.\n- DIN VDE V 0126-95:2025-12 depolamali cihazlari kapsamiyor.\n- VDE-AR-N 4105:2026-03, 800 VA'e\
  \ kadar depolamali sistemin kullanici tarafindan kurulmasina izin veriyor.\n- EEG 2027'nin sizdirilmis taslagi\
  \ basitlestirmeyi DC kuplaja bagliyor.\n\n(4) AB Pil Tuzugu 2023/1542: metni bu revizyonda AB Yayin Ofisi'nden\
  \ actim.\n- Tasinabilir pil: muhurlu, <= 5 kg ve endustriyel kullanim icin tasarlanmamis. Madde 11 geregi 18.02.2027'den\
  \ itibaren son kullanici tarafindan cikarilabilir ve degistirilebilir olmali.\n- 5 kg'dan agir pil endustriyel\
  \ pildir. SBESS taniminda kWh esigi YOKTUR. Bu yuzden sebekeye ya da son kullaniciya enerji veren 5 kg ustu kutu\
  \ SBESS sayilir ve Madde 12 + Ek V (11 guvenlik parametresi) uygulanir.\n- 2 kWh esigi yalnizca uc yukumlulugu\
  \ tetikler: karbon ayak izi (Madde 7), performans belgesi (Madde 10) ve pil pasaportu (Madde 77, 18.02.2027'den\
  \ itibaren).\n- Durusti inceleme yukumlulugu 2025/1561 ile 18.08.2027'ye ertelendi; 40 M EUR ciro esigi var.\n\
  \n(5) Hava tasimasi (IATA 2026):\n- Tek basina gonderilen Na-iyon pil (UN 3551), Wh degerinden bagimsiz olarak\
  \ yolcu ucaginda yasaktir ve SoC en fazla %30 olmalidir. Power bank ve power pack urunleri pil sayilir.\n- 100\
  \ Wh ve 20 Wh esikleri yalnizca ekipmanla birlikte veya ekipman icinde gonderimde gecerlidir.\n- Ekipman icinde\
  \ de olsa paket basina pil 5 kg'i asarsa yolcu ucagina yuklenemez.\n\n(6) Uretim tarafi mevzuati bu revizyonda\
  \ eklendi:\n- Makineyi kendi kullanimi icin yapan firma da 'uretici' sayilir (2006/42/AT Madde 2(i)).\n- Makine\
  \ Tuzugu 2023/1230, 20.01.2027'den itibaren zorunlu.\n- Silan/H2 (ATEX), HF ve RF induksiyon (CISPR 11 Grup 2)\
  \ kalemleri eklendi. Maliyetler tahmin.\n\n(7) RoHS: PV panel istisnasi yalnizca profesyonellerce kurulan sabit\
  \ sistemler icindir. Fisli ve tasinabilir panellerde homojen malzemede Pb <= %0,1 olmali, yani baglanti kursunsuz\
  \ yapilmali.\n\n(8) Maliyet:\n- Standartlarin zorunlu kildigi unite basi testlerin iscilik payi 0,02-0,22 c/W.\
  \ Kalite testleri (EL, pil hat sonu, fonksiyon) eklenirse 50-100 W'ta 1,3-2,6 c/W'a cikiyor; bu testler uretim\
  \ alanina devredildi.\n- Tip testi toplami, parametre araliklarindan turetildi (alt/merkez/ust, tamami tahmin):\n\
  \  - A-DE, bilesenler satin alinirsa: 75/225/596 bin USD\n  - A-DE, kendi konnektor ve baglanti kutusuyla: 91/268/706\
  \ bin USD\n  - Genisletilmis program (3 aile, 3 ulke, radyo): 113/363/966 bin USD\n  - B, yalniz-DC ve <= 5 kg\
  \ pil: 55/165/426 bin USD\n- W basina pay unite ciktisina baglidir. K9'daki 150 bin hucre/yil, 1 kWh kutu ve 10\
  \ Wh hucreyle unite yilda 1500 kutu cikarir. Bu durumda merkez deger tek unitede ~4,5 c/W, 4 unitede ~1,1 c/W'tir;\
  \ 50 Wh hucreyle tek unitede ~0,9 c/W'a iner.\n\nEn buyuk belirsizlikler:\n- Turkiye'de fisli PV cercevesi ve\
  \ urun uygunluk yolu (bilmiyoruz).\n- Na-iyon + PV + invertor entegre fisli urune hangi urun standardinin uygulanacagi.\n\
  - IEC 60364-7-712:2025'teki sinirlar.\n- Laboratuvar fiyatlari.\n\nKur varsayimi: 1 EUR = 1,15 USD (tahmin)."
parametreler:
- id: std_selv_pv_uocmax_limit_v
  ad: PV DC tarafi SELV/PELV icin azami acik devre gerilimi (U_OC_MAX, soguk hava dahil)
  birim: V DC
  deger: 60
  alt: 60
  ust: 60
  kaynak: IEC 60364-7-712:2017 madde 712.414.101
  kaynak_turu: standart_metni_dogrulanmis
  kaynak_alintisi: '''712.414.101 For the use of SELV and PELV protective measures on the DC side, UOC MAX shall
    not exceed 60 V DC.'''
  kaynak_tarihi: IEC 60364-7-712 Ed.2.0 2017-04; revizyonda yeniden okundu 2026-09-27
  guven: yuksek
  maliyet_sinifi: teknik
  olcek: urun
  senaryoya_uygunluk: Kurulum standardi; A ve B icin gecerli. Kategorik rejim degeridir, surekli belirsizlik araligi
    DEGILDIR (Monte Carlo'da orneklenmemeli).
  aciklama: 'Revizyon: alt deger 35 -> 60 yapildi; Avusturya 35 V ayri pazar bayragi (std_austria_selv_pv_v). Ed.3.0
    2025-10 yayimlandi; onizlemede 712.414 basligi var, 60 V degerinin korunup korunmadigi dogrulanmadi. | [Uzlaştırma/zincir]
    Kanonik (tek sahip). Sinir soguk U_OC_MAX''a uygulanir (K6). Deger okunan baskinin (2017) metninden; guncel
    baskida korundugu ayrica dogrulanacak (Class III ile ayni kural). SELV icin kutunun PV-sebeke arasi guvenli
    ayirmasi sart.'
  dogrulama_deneyi: IEC 60364-7-712:2025'i satin al (~400 CHF); 712.414 ve yeni DC bara/pil maddelerini oku.
- id: std_austria_selv_pv_v
  ad: 'Avusturya ulusal sapmasi: PV DC SELV siniri (pazar bayragi)'
  birim: V DC
  deger: 35
  alt: 35
  ust: 35
  kaynak: IEC 60364-7-712:2017 Ek F, AT 712.414.101
  kaynak_turu: standart_metni_dogrulanmis
  kaynak_alintisi: AT 712.414.101 In Austria ... only a limit of 35 V is acceptable.
  kaynak_tarihi: 2017-04; 2026-09-27
  guven: yuksek
  maliyet_sinifi: teknik
  olcek: genel
  senaryoya_uygunluk: Avusturya pazari hedeflenirse V_lim=35 secilmeli; 60 V mimarisi orada SELV sayilmaz.
  aciklama: 'Kategorik pazar degeri. | [Uzlaştırma/zincir] İlişkili (eşdeğer değil) → std_dvca_dc_wet_v: AT PV SELV
    siniri; ayni sayi, farkli dayanak.'
  dogrulama_deneyi: OVE E 8101 guncel metninin kontrolu (AT pazari icin).
- id: std_selv_dry_no_basic_protection_dc_v
  ad: 'SELV/PELV: normal KURU kosulda temel korumanin gerekmedigi DC sinir'
  birim: V DC
  deger: 60
  alt: 60
  ust: 60
  kaynak: IEC 60364-4-41:2005 madde 414.4.5
  kaynak_turu: standart_metni_dogrulanmis
  kaynak_alintisi: Basic protection is generally unnecessary in normal dry conditions for SELV circuits where the
    nominal voltage does not exceed 25 V a.c. or 60 V d.c.
  kaynak_tarihi: Ed.5.0 2005-12; 2026-09-27
  guven: yuksek
  maliyet_sinifi: teknik
  olcek: genel
  senaryoya_uygunluk: Balkon/dis ortam kuru kosul sayilmaz; yalniz ic mekanda kullanilan B kutusu icin.
  aciklama: K6'daki 60 V ile ayni sayi, ama yalniz kuru kosul icin.
  dogrulama_deneyi: Ed.5.1 (2017) konsolide metinde degisiklik kontrolu.
- id: std_selv_wet_no_basic_protection_dc_v
  ad: 'SELV/PELV: kuru olmayan (diger) kosullarda temel korumasiz DC sinir'
  birim: V DC
  deger: 30
  alt: 30
  ust: 30
  kaynak: IEC 60364-4-41:2005 madde 414.4.5
  kaynak_turu: standart_metni_dogrulanmis
  kaynak_alintisi: In all other cases, basic protection is not required if the nominal voltage of the SELV or PELV
    system does not exceed 12 V a.c. or 30 V d.c.
  kaynak_tarihi: 2005-12; 2026-09-27
  guven: yuksek
  maliyet_sinifi: teknik
  olcek: genel
  senaryoya_uygunluk: Dis ortamdaki panel/kablo/konnektor icin; 30 V ustunde canli parca yalitimli/kapali olmali.
  aciklama: '-'
  dogrulama_deneyi: '-'
- id: std_elv_band1_dc_max_v
  ad: ELV Band I ust siniri (SELV/PELV mutlak ust sinir)
  birim: V DC
  deger: 120
  alt: 120
  ust: 120
  kaynak: IEC 60364-4-41:2005 madde 414.1.1
  kaynak_turu: standart_metni_dogrulanmis
  kaynak_alintisi: limitation of voltage in the SELV or PELV system to the upper limit of voltage Band I, 50 V a.c.
    or 120 V d.c.
  kaynak_tarihi: 2005-12; 2026-09-27
  guven: yuksek
  maliyet_sinifi: teknik
  olcek: genel
  senaryoya_uygunluk: PV icin 712 bunu 60 V'a indirir. Pil barasi icin 120 V yalniz PV'den galvanik ayrilmis (pv_batt_isolated)
    ise kullanilabilir.
  aciklama: '414.1.1 ayrica ''protective separation ... from all circuits other than SELV and PELV'' sarti koyar.
    414.3.3: pil ve yuksek gerilim devresinden bagimsiz kaynaklar SELV kaynagi olabilir.'
  dogrulama_deneyi: '-'
- id: std_dvca_dc_wet_v
  ad: IEC 62109-1 DVC-A siniri, islak konum
  birim: V DC
  deger: 35
  alt: 35
  ust: 35
  kaynak: DEKRA test raporu 6067599.50A (TRF IEC62109_1B); IEC TS 62257-9-8:2020 onizlemesi
  kaynak_turu: dogrulanmis_url
  kaynak_alintisi: '''DVC A: 60Vdc (35Vdc for wet location)'''
  kaynak_tarihi: Rapor 2020-01-22; revizyonda yeniden indirildi 2026-09-27
  guven: yuksek
  maliyet_sinifi: teknik
  olcek: urun
  senaryoya_uygunluk: Dis ortam kutusu (K5) islak konumdur; PV ve pil portlari ancak U <= 35 V ise probe ile dokunulabilir
    olabilir.
  aciklama: IEC TS 62257-9-8:2020 onizlemesi de 35 V'un 'DVC-A for wet locations in Table 6 of IEC 62109-1:2010'
    oldugunu teyit ediyor. IEC 62109-1 Ed.2 hazirlaniyor (dogrulanmadi). | [Uzlaştırma/zincir] Kanonik (tek sahip).
    dvca35 rejiminde soguk U_OC_MAX'a uygulanir (varsayilan N_s 36). 414.4.5'in islak temel korumasiz 30 V'u ayri
    kategori (elv30); Class III 35 V STC'dir ve ayri kanonik.
  dogrulama_deneyi: IEC 62109-1 Ed.2 yayimlaninca Tablo 6 kontrolu.
- id: std_dvca_dc_dry_v
  ad: IEC 62109-1 DVC-A siniri, kuru konum
  birim: V DC
  deger: 60
  alt: 60
  ust: 60
  kaynak: DEKRA TRF IEC62109_1B
  kaynak_turu: dogrulanmis_url
  kaynak_alintisi: 'DVC A: 60Vdc (35Vdc for wet location)'
  kaynak_tarihi: 2020-01-22; 2026-09-27
  guven: yuksek
  maliyet_sinifi: teknik
  olcek: urun
  senaryoya_uygunluk: Yalniz ic mekan (B ev ici).
  aciklama: 'DVC-B sinirlarini dogrulayamadim. | [Uzlaştırma/zincir] İlişkili (eşdeğer değil) → std_selv_pv_uocmax_limit_v:
    Urun DVC-A kuru siniri; ayri kontrol.'
  dogrulama_deneyi: Standart Tablo 6.
- id: std_class3_voc_stc_max_v
  ad: 'IEC 61730-1:2016 Class III modul: azami Voc (STC)'
  birim: V DC
  deger: 35
  alt: 35
  ust: 35
  kaynak: IEC 61730-1:2016 madde 4.4.1 (SIS resmi onizlemesi)
  kaynak_turu: standart_metni_dogrulanmis
  kaynak_alintisi: '''Class III PV modules shall not have electrical ratings greater than 240 W where the open-circuit
    voltage does not exceed 35 V DC and the short-circuit current does not exceed 8 A when tested under standard
    test conditions.'''
  kaynak_tarihi: Standart 2016-08; onizleme 2026-09-27
  guven: yuksek
  maliyet_sinifi: teknik
  olcek: urun
  senaryoya_uygunluk: B senaryosunda tek dizili kucuk urunde mumkun; A (cok panel, 300-500 W) icin mumkun degil.
  aciklama: 'Standart metni (4.4.1) modul basina sinir veriyor; ''seri/paralel kombinasyonlara uygulanir'' ifadesi
    UL ozetinden geliyor (4.4.3 onizlemede yok). Eski 2004 baskisi Application Class C: ''<50 V DC and 240 W''.
    2023 baskisinda Class III icin DTI sarti kaldirildi. | [Uzlaştırma/zincir] Kanonik (tek sahip). STC degeridir
    (soguk degil). Guven 60 V SELV ile ayni kuralla yuksek (okunan baskinin metni); 2023 baskisinda (madde 5.4)
    korundugu ayrica dogrulanacak. Belirsiz olan deger degil, ''kutu toplami'' yorumu (UL ozeti; 4.4.3 goruntulenmedi).
    Formul standart''in, marjlar modul''un: N_s <= 45 (cift 44), ilk nesil eta ile P ~161-181 W, olgun ~187-210
    W.'
  dogrulama_deneyi: IEC 61730-1:2023 madde 5.4 ve 4.4.3 esdegeri metnin satin alinmasi.
- id: std_class3_pmax_w
  ad: Class III modul azami gucu (STC)
  birim: W
  deger: 240
  alt: 240
  ust: 240
  kaynak: IEC 61730-1:2016 madde 4.4.1 (SIS onizlemesi)
  kaynak_turu: standart_metni_dogrulanmis
  kaynak_alintisi: '...shall not have electrical ratings greater than 240 W...'
  kaynak_tarihi: 2016-08; 2026-09-27
  guven: yuksek
  maliyet_sinifi: teknik
  olcek: urun
  senaryoya_uygunluk: 'Pratikte V*I*FF siniri baglayici: STC tanimiyla N_s=46 icin 214-228 W; islak DVC-A/AT ile
    N_s=42 icin 195-208 W (FF 0,78-0,83).'
  aciklama: Muhafazakar yorumda kutudaki tum panellerin toplamina uygulanir (n_panel_per_box*P_panel_W).
  dogrulama_deneyi: Sertifika kurulusuyla 'panel basina ayri MPPT girisi paralel sayilir mi' sorusu.
- id: std_class3_isc_max_a
  ad: Class III modul azami kisa devre akimi (STC)
  birim: A
  deger: 8
  alt: 8
  ust: 8
  kaynak: IEC 61730-1:2016 madde 4.4.1
  kaynak_turu: standart_metni_dogrulanmis
  kaynak_alintisi: '''...the short-circuit current does not exceed 8 A when tested under standard test conditions.'''
  kaynak_tarihi: 2016-08 / 2020-06; 2026-09-27
  guven: yuksek
  maliyet_sinifi: teknik
  olcek: urun
  senaryoya_uygunluk: 'HJT Jsc ~39,5 mA/cm2 ile HUCRE alani <= ~202 cm2. Wafer boyutunu sinirlamaz: 182 mm yarim
    hucre (165,6 cm2, 6,5 A) ve 210 mm ucte bir (147 cm2, 5,8 A) uyar.'
  aciklama: 'Revizyon: ilk ciktidaki ''a_wafer <= 141 mm, kucuk wafer lehine'' yorumu yanlisti; kisit A_cell_m2
    uzerinden yazildi. Kesim kenari rekombinasyon kaybi bilinmiyor (hucre alani). | [Uzlaştırma/zincir] Kanonik
    (tek sahip). Hucre ALANINI sinirlar: sinir Jsc 41.3, marj 1.03, N_p = 1 ile a <= ~137 mm (mod_f_a_max_class3).
    182-210 mm wafer n_cut/k_split ile uyar.'
  dogrulama_deneyi: '-'
- id: std_uocmax_default_factor
  ad: U_OC_MAX / U_OC_STC geri dusus katsayisi (alfa veya T_min bilinmiyorsa)
  birim: '-'
  deger: 1.2
  alt: 1.2
  ust: 1.2
  kaynak: IEC 60364-7-712:2017 Ek B.1
  kaynak_turu: standart_metni_dogrulanmis
  kaynak_alintisi: Without information of the expected minimum temperature of the site or without information about
    the temperature coefficient of the PV module, UOC MAX shall be chosen equal to 1,2 UOC STC.
  kaynak_tarihi: 2017-04; 2026-09-27
  guven: yuksek
  maliyet_sinifi: teknik
  olcek: urun
  senaryoya_uygunluk: IEC 61215 tip testinde sicaklik katsayisi olculdugu icin kendi modulumuzde alfa beyan edilir;
    1,2 pratikte devreye girmez.
  aciklama: 'Revizyon: aralik 1,08-1,2 kaldirildi (kural degeri). Belirsizlik std_tmin_site_c ve alpha_Voc_pct_K
    uzerinden orneklenir; K_U = std_f_ku.'
  dogrulama_deneyi: '-'
- id: std_iscmax_factor
  ad: I_SC_MAX / I_SC_STC asgari katsayi
  birim: '-'
  deger: 1.25
  alt: 1.25
  ust: 1.4
  kaynak: IEC 60364-7-712:2017 Ek B.2
  kaynak_turu: standart_metni_dogrulanmis
  kaynak_alintisi: ISC MAX = KI ISC STC. Minimum value for K I is 1,25.
  kaynak_tarihi: 2017-04; 2026-09-27
  guven: yuksek
  maliyet_sinifi: teknik
  olcek: urun
  senaryoya_uygunluk: Bifasiyel/yansimali balkon kurulumunda artirilmali.
  aciklama: Ust 1,4 tahmindir.
  dogrulama_deneyi: Bifasiyel ise arka yuz kazanc olcumu.
- id: std_tmin_site_c
  ad: U_OC_MAX hesabinda kullanilan en dusuk saha sicakligi
  birim: C
  deger: -40
  alt: -40
  ust: -9
  kaynak: 'Tasarim secimi; dayanak MGM rekorlari (modul revizyonunda acildi): Istanbul -9.0, Ankara -24.9, Erzurum
    -37.2 C; modul kaynaginda Almanya Hull -37.8 C'
  kaynak_turu: tahmin
  kaynak_alintisi: '''En Düşük Sıcaklık (°C): İstanbul -9,0 (Şubat); Ankara -24,9 (Ocak); Erzurum -37,2 (Aralık)'''
  kaynak_tarihi: 2026-09
  guven: orta
  maliyet_sinifi: teknik
  olcek: genel
  senaryoya_uygunluk: 'Tek urunu tum AB''de satmak icin en kotu pazar alinmali. alfa=-0,24 %/K ile K_U: -30 C 1,132;
    -20 C 1,108; -10 C 1,084; -5 C 1,072.'
  aciklama: '60 V''ta N_s_max 71-74 arasinda degisir. | [Uzlaştırma/zincir] Kanonik (tek sahip). Pazar/saha kavrami
    -> standart sahip. Deger bir tasarim secimidir (istasyon rekorlari dayanak, -40 degil); bu yuzden kaynak_turu
    tahmin. Pazar anahtari: TR_marmara -10, TR_ic -25, DE_AT -40, tek_urun -40 (varsayilan; A''nin ana pazari Almanya,
    rekor -37.8 C). Modulun guveni yuksek itirazi (''tek urun icin -40 C'') uygulandi. ku_yontemi = varsayilan_1.2
    iken T_min N_s_max''i baglamaz (K_U 1.2 > 1.159); beyan_alfa''da baglar.'
  dogrulama_deneyi: Hedef pazar iklim kayitlari (MGM, DWD) ve sertifika kurulusunun kabul ettigi T_min.
