alan: hucre
ozet: 'Revize hucre modeli su bicimde: eta_cell = eta_core(tau_SRH, on-tavlama) x (1 - cevre x w_eq / alan) x bekleme
  faktoru. w_eq, rekombinasyon ve TCO''suz bant kayiplarini toplayan esdeger olu kenar genisligidir.


  (1) KENAR. Dogal kenar icin w_eq = 0.26 mm (Wohler 2024 olcumu j02 = 2.41 nA/cm''e kalibre; fizik denetcisinin
  bagimsiz modeli 0.24-0.25 mm verdi). Secenekler TOPLAM w_eq ile karsilastirildi:

  - B: islem oncesi kesim + arka yuzde 1 mm TCO dislama -> 0.61 mm

  - C: islem sonrasi TLS kesim -> 0.8 mm. Ilk ciktidaki ''3 kat'' yanlisti; dogru oran ~1.3 kat.

  - Lazer cizik-kir -> 3.8 mm (~6 kat)

  - D: islem sonrasi kesim + 250 C altinda yeniden pasivasyon -> 0.26-0.35 mm olabilir. Ancak bu seviyenin 250 C
  altinda saglanabildigi kanitlanmadi; Giglia''nin verisi simulasyon.

  - On yuzde dislama -> 0.32 mm. Arka TCO''nun on n-katmanina sarilmasi sont riski tasir; ilk ciktidaki ''kaybi
  yariya indirir'' ifadesi geri cekildi.

  a=50 mm''de verim: B %24.83, C %24.43, D %25.56 (iyimser). a=210 mm''de B %25.80. Kilit belirsizlik w_eq; Deney
  1''de B, C, D ve on/arka dislama kollari esit agirlikta denenmeli.


  (2) WAFER KALITESI. TaiyangNews 2023 raporunun PDF''i bu gorevde okundu: gettering amacli on-tavlama HJT hatlarinin
  cogunda standart. ''HJT''de gettering yok'' ifadesi geri cekildi. On-tavlama artik bir tasarim secimi; kurtarma
  orani bilinmiyor.

  - tau artik acikca SRH-only olarak tanimli. Referans 7 ms; 1 Ohm cm''de efektif yigin omru ~3.8-4.5 ms.

  - Yeniden fit: eta = eta_core + 1.18*[ln(1+3.35/7) - ln(1+3.35/tau)]. tau=2 ms''de -0.70 puan (aralik -0.57 ile
  -0.82), 1 ms''de -1.27 puan.

  - Kristal hedefi: kayip 0.3 puani gecmesin diye tau_SRH >= 3.7 ms. Ballif''in tau/rho >= 1 kriteri yalnizca asgari
  esik; 1 Ohm cm''de -1.27 puan demek.

  - K8 itirazi (kuyruk ucunu geri eritmek metal biriktirir) Scheil kutle dengesine gore yanlisti; geri cekildi.


  (3) UNITE MIMARISI (en onemli yeni bulgu). K9''dan turetilen unite PV ihtiyaci, pil hucre formatina ve Wh/W oranina
  gore 0.1-46 MW/yil araliginda. Silindirik Na-ion hucrelerle yalnizca 0.1-1.5 MW/yil.

  - En kucuk makul HJT arac seti (L=1 m tasiyici) 40-50 MW/yil kapasiteli; ~3.1 M$ capex (aralik 2.0-6.5 M$, tahmin)
  ve ~2.5 M$ arac tasarim NRE''si ister.

  - Tasiyiciyi L=0.5 m''ye kucultmek kapasiteyi 4 kat dusurur, capex''i ise yalnizca ~%15 azaltir (0.062 -> 0.23
  $/(W/yil)).

  - Zaman sinifi hucre maliyeti (amortisman + bakim + iscilik + taban enerji): 45 MW/yil''da ~2.7 c/W, 10 MW/yil''da
  ~12 c/W, 2 MW/yil''da ~61 c/W.

  Sonuc: ''unite = PV + pil senkron'' tanimi hucre hattinin asgari ekonomik olcegiyle uyumsuz. Hucre hatti (buyuk
  olasilikla kristal de) saha duzeyinde N uniteye paylastirilmali ya da unite tanimi degismeli. Karar kullanicinin.


  (4) MALIYET.

  - Gumus: pasta kutlesi ve Ag orani artik ayri parametre; kirik ve reddedilen hucre payi paydada. Kendi yazicimizla
  olgunlukta 3.5-3.7 c/W, baslangicta 5.8-6.0 c/W, AgCu ile 1.4 c/W.

  - ITO kutle dengesi duzeltildi: etkin verim = hedef kullanimi x aktarim, hurda kredisi hedef kullanimina bagli.
  Sonuc 1.25-1.57 c/W (ilk ciktida ~1.0).

  - Diger alan kalemleri (kimya, gaz, tasiyici yenileme, marjinal elektrik, UPW) ~0.7 c/W.

  - Toplam hucre donusum maliyeti (wafer ve saha altyapisi haric), a=105 mm: 45 MW/yil''da ~8.4 c/W (saf Ag) veya
  ~6.2 c/W (AgCu); 10 MW/yil''da ~18 c/W. Degerlerin cogu tahmindir, ama Cin GW hatlarinin cok ustunde olduklari
  acik.


  (5) ADET. IV ve tasima capex''i istasyon sayisiyla adet sinifinda modellendi; cift sayim giderildi. 50 mm hucrede
  tekli tutucuyla ~0.9 c/W, 16''li tutucuyla ~0.13 c/W. 210 mm''de ~0.1 c/W taban var (en az 1 robot + 1 IV istasyonu).


  (6) DIGER DUZELTMELER.

  - Enerjide cift sayim giderildi: marjinal kWh/m2 + taban kW.

  - Uptime yalnizca kapasite formulunde uygulaniyor; yil 8760 saat.

  - Islak tezgah kapasitesi artik a''ya bagli (cok seritli kaset).

  - Boyuta ozgu takim ve yeniden kalifikasyon urun_sabit olarak eklendi.

  - Iscilik, bakim, N2, kimyasal ve gaz fiyatlari eklendi.

  - K6 itirazinin yonu duzeltildi: SELV (N_s <= 72) buyuk P_panel''de en kucuk hucreyi zorlar; 500 W icin a >= ~168
  mm veya N_p >= 2.

  - K5 geregi panel arkasi serbest, cift yuzluluk kullanilabilir.

  - Indiyum birincil arzi USGS''ye gore ~1080 t/yil (2024e).


  EN BUYUK BELIRSIZLIKLER: kendi PECVD/PVD aracimizla pasivasyon ve baslangic verimi (%19-24.5), w_eq ve D seceneginin
  gercekten ulasilabilirligi, on-tavlama kurtarma orani, kendi yapim capex ve NRE, tasiyici omru.


  Kur varsayimi: 1 USD = 6.72 CNY = 48.92 TRY (TradingEconomics, 25 Eylul 2026).'
