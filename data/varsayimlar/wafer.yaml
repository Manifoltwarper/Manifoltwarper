alan: wafer
ozet: '1) Geometri ve revizyonun en onemli sonucu. Tek parca formatta kesit kullanimi geometriyle sinirli: tam kare
  2/pi = 0.637, M10 psodo-kare 0.690 (taslanmis kesit) ve 0.667-0.670 (as-grown kesit), altigen 0.827. Onceki ciktidaki
  ''k_split wafer boyunu ingot capindan bagimsiz kilar'' iddiasi yalnizca D her a icin serbestce secilebiliyorsa
  dogru; o zaman eta her boyutta ~0.66-0.67 olur. Tek bir firin tasariminda D sabitse tamsayi paketleme verimi basamakli
  ve sureksiz degisir. D=250 mm''de: a=40 icin 0.72, 50 icin 0.66, 80 icin 0.52, 105 icin 0.45, 156 icin 0.50, 182
  icin 0.67; 210 sigmaz. D=300 mm''de: a=50 icin 0.74 (satir paketleme), 105 icin 0.62, 156 icin 0.34, 182 icin
  0.47, 210 icin 0.62. Iyi wafer m2 basina kristallesen kutle bu yuzden ayni D''de 2.3 kata kadar degisir (ilk nesilde
  D=300 ile 50 mm''de 0.61, 156 mm''de 1.40 kg/m2). P_panel -> a eslemesi eta(a|D) basamaklarini icermeli; a ''tatli
  noktalardan'' secilmeli ya da D ayarlanabilir bir bant olarak kristal ajaniyla birlikte optimize edilmeli.

  2) H1 duzeltildi: varsayilan senaryo artik ilk nesil kendi testeremiz. Degerler: kerf 57 um, celik tel 36 um,
  t 115-125 um, besleme 1.2 mm/dk, kesim kirilma referansi %2, hucre kirilmasi %2, tel tuketimi 1.8 kat. Olgun degerler
  (kerf 50, t 95-115, besleme 1.75, kirilma %0.5 / %0.25) ayri parametre olarak tutuldu ve bir ogrenme egrisiyle
  (wf_learn_half_m2) birlestiriliyor. a=182 icin ilk nesilde kristallesen kutle 0.72 kg/m2 (olgunda 0.62, yani +%15),
  taze poli 0.48 kg/m2 (olgunda 0.42), testere 25 m2/saat (olgunda 44, yani -%42).

  3) Kerf en buyuk geri kazanilamayan kayip: tugla kutlesinin %31-35''i. HJT kalitesinde unite icinde kerf geri
  kazanimi gosterilmedi. Tek kanit (CABRISS) bulamac kerfi, DS mc-Si ve grafit pota kontaminasyonuyla yapilmis;
  bu yuzden bu bir dogal sinir degil, teknoloji/ekonomi engeli (''bilmiyoruz''). Temel senaryoda 0 alindi.

  4) Geri donusum (K8) iyi wafer m2 basina kristallesen kutleyi degistirmez; taze poli alimini ~%33-40 azaltir.
  Firin eriyik/taze orani yerlesime gore 1.4 ile 2.5 arasinda degisir. Modelin taze/wafer orani 130 um ve kayipsiz
  ideal durumda 1.385; bu, ITRPV 17''nin M10 degerine (1.68 g/W, orani 1.39-1.44) uyuyor. Varsayilan kayiplarla
  oran 1.55; fark pota kalintisi (+%3), dilim geri kazanim kaybi (+%5.5) ve kirilma/ret/tugla ucundan (+%3) geliyor.

  5) Testere alan hizi, tel agi dolu tutuldugunda wafer boyundan buyuk olcude bagimsiz. 600 mm yuklu kendi testeremiz
  ilk nesilde 17-28 m2/saat (eta_cell 0.25 ile 36-62 MW/yil), olgunda 29-49 m2/saat (64-106 MW/yil) verir. Onceki
  ''~70 MW'' degeri tutarsizdi; artik tek eta_cell ile saw_MW_per_yr formulunden hesaplaniyor. Ornek unitede (2
  firin x 60 kg/gun kristallesen) cikti 167 m2/gun (~15 MW/yil), testere kullanimi %27.

  6) H3 dogru ama sinirli. Ilk nesil parametrelerle kesim kirilmasi 182 mm / 125 um''de %2.23, 50 mm / 115 um''de
  %0.55 (4 kat azalma). n_a=3 ve taban payi 0.25 ile en fazla ~6.7 kat azalabilir; n_a=1 ise yalnizca 1.2-1.5 kat.
  m2 basina wafer sayisi 13 kat artar. Unite olceginde adet bazli istasyonlar dusuk kullanimli (M10''da %7) ve maliyet
  basamakli: 50 mm''de D=300 ile 2 muayene istasyonu gerekir. Onceki ''adet maliyeti patlar'' ifadesi GW sezgisiydi.

  7) Yap-ya-da-al, tutarli iki zincirle yeniden kuruldu. Cin zinciri: satin alinan M10 teslim ~$4.91/m2 ($0.0196/W;
  FOB $0.148 artisi tahmini gumruk ve lojistik). Kendi yapimimizda Cin polisi $2.10/m2, kristal donusumu (kristal
  ajani) ve wafer donusumu gelir. Wafer donusumunun unite olcegindeki merkez tahmini $7.2/m2; parametre uclarinda
  $1.6-21/m2 (tahminlere dayali). Cin zincirinde kendi yapimimiz en iyimser durumda bile ancak basabas. Izlenebilir
  zincir: Cin disi poli $17.5/kg ($8.4/m2); Cin disi wafer fiyati bilinmiyor (tahmin $0.35/adet), yani sonuc teklif
  alinmadan belirlenemez. K3 kalici bir secenek olarak modellenmeli. AB 2024/3015 (zorla calistirma) 13 Aralik 2024''te
  yururluge girdi; uygulama tarihi dogrulanmadi. Bu, balkon (A) senaryosunda izlenebilirlik riskini artirir.

  8) Satin alinan wafer''i bolme: TaiyangNews''teki ''half-wafer processing'', yan dilimlerden yarim tugla cikarmak
  anlamina geliyor (tugla bolme, k_split fikrini destekliyor), TLS ile on-bolme degil. TLS''in 6000 wph degeri hucre
  ayirma icin; ciplak wafer''in hucre oncesi bolunmesi deneyle dogrulanmali. Geometri kontrolu: standart D/a oranlarinda
  yan dilimin en kalin yeri 0.18-0.20a, yani yarim tugla sigmaz. Bu kaldirac ancak buyuk D / kucuk a durumunda calisir
  ve yerlesim fonksiyonunun icinde zaten var.

  9) En buyuk belirsizlikler: kendi firinimizda D''nin ayarlanabilirlik bandi; zincire gore teslim poli ve wafer
  fiyatlari ile Turkiye gumrugu; unite olcegindeki donusum maliyeti (capex, personel, CRF); kendi testeremizin kerf,
  besleme ve kirilmasi; kirilmanin boyut ussu ve taban payi; bolunmus HJT parcalarinda kenar kaybi; k x k ve satir
  parcalarinin radyal ozellik farki.'
