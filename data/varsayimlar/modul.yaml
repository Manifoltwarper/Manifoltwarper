alan: modul
ozet: 'REVİZE. Modül alanı P_panel_W değerinden N_s, N_p, a_wafer_mm, yerleşim, panel boyutu, kütle, cam gereksinimi,
  BOM ve zaman maliyetini hesaplar. Bu revizyonda iki denetçinin bulguları kontrol edildi (WebFetch, curl, python3)
  ve çıktıya işlendi.


  (1) Gerilim ve sınıf. IEC 60364-7-712:2017 madde 712.414.101''e göre PV''nin DC tarafında SELV/PELV için UOC MAX
  60 V DC''yi geçemez. UOC MAX = KU·UOC_STC; KU = 1 + α(Tmin − 25) ve Tmin sahanın en düşük ortam sıcaklığıdır (Ek
  B). SELV''de modül Class III ya da Class II olabilir. Kısacası K6''daki ''60 V SELV'' PV kurulum standardında
  tanımlı bir sınırdır. Ancak DC tarafın SELV sayılabilmesi için kutunun şebekeden güvenli ayırma sağlaması gerekir.

  IEC 61730-1 Class III sınırları STC''de Voc ≤ 35 V, Isc ≤ 8 A ve P ≤ 240 W''tır (2016 baskısında madde 4.4.1;
  2023 baskısında madde 5.4''e taşınmış, metni doğrulanmadı). %3 Voc ve Isc marjıyla N_s ≤ 45, a ≤ 137 mm, P ≤ ~198
  W çıkar. 60 V''luk panel Class II olmak zorundadır.

  N_s_max: 60 V''ta T_min −20 °C için 70; −37.2 °C''de 68, −40 °C''de 67. Standardın varsayılan KU = 1.2 değeri
  kullanılırsa 65. 35 V''ta 41, çift sütunlu yerleşim nedeniyle 40.


  (2) MPPT penceresi. Sıcak Vmp artık 85 °C ile hesaplanıyor (70 °C bir P98 sınıf eşiğidir). 60 V dalında 37.3 V,
  bir baypas iletimdeyken 24.5 V. 35 V dalında 21.3 V ve 10.6 V.


  (3) Rüzgâr. EN 1990 γQ = 1.5 ile IEC 61215 γM = 1.5 birlikte uygulanırsa gereken test yükü 2.25·qp·cp_net olur.
  Örnek: qp = 850 Pa, cp_net = 1.8 (EN 1991-1-4 Tablo 7.9, B bölgesi, dönüşlü) ile ≈ 3440 Pa. Bu durumda balkonda
  2400 Pa belirsizdir. Öneri: simetrik 3600 Pa varyantı ile birlikte yükseklik ve uç bölge kısıtı. Uç bölgede (A,
  l/h ≥ 10) cp 3.4''e çıkar ve yük 6.5 kPa''yı bulur; bu konumlar montaj talimatıyla dışlanmalı.


  (4) Cam. Kalibrasyon Waaree''nin 2+2 yarı temperli (HS) çerçeveli modülüne göre yenilendi.

  - Cam-cam 2+2, çerçevesiz ve ≤ 3600 Pa''da 500 W''a kadar yeterli; bu aralıkta cam maliyeti alanla doğrusal.

  - Tek camlı 2.0 mm HS cam-arka tabaka yapı 2400 Pa''da yalnızca ~200 W''a kadar (b ≲ 0.9 m) yeterli.

  - 5400 Pa''da çerçevesiz 2+2, ~400 W üstünde yetmiyor.


  (5) Hücre hariç BOM (GG, çerçevesiz, 60 V). Arka cam ayrı fiyatlandı.

  - 50 W: 15.0 ¢/W

  - 100 W: 10.7 ¢/W

  - 200 W: 8.5 ¢/W

  - 300 W: 7.9 ¢/W

  - 400 W: 7.6 ¢/W

  - 500 W: 7.5 ¢/W

  K5''ten gelen panel-kutu kablosu ve konnektör (3 m) bu rakamlara eklenir: 50 W''ta 5.6 ¢/W, 500 W''ta 0.9 ¢/W.
  Bu kalem eskiden hiç yoktu.


  (6) En büyük yeni bulgu: zaman sınıfı maliyeti. Modül hattının yıllık sabit maliyeti ~69 k$''dır (laminatör +
  dizgi + test ≈ 280 k$ yatırım ve asgari ekip). Tek ünitenin K9 senkronundan çıkabilecek hacim 0.2-1.5 MWp/yıl;
  bu hacimde zaman maliyeti 34-7 ¢/W olur ve BOM''u aşar. Karşılaştırma için Çin''de hücre dahil tam 210 mm HJT
  modül 0.110 $/W (InfoLink, 23.09.2026). Modül montajı saha düzeyinde paylaşılmalı: ≥ 3 MWp/yıl''da ~2.8 ¢/W.


  (7) Ara bağlantı modeline parmak direnci eklendi. Optimum tel sayısında kayıp 55 mm hücrede %1.8, 110 mm''de %3.0,
  176 mm''de %4.5; buna göre CTM(a) 0.99''dan 0.96''ya iner.


  En büyük belirsizlikler:

  - γQ ve γM''nin birlikte uygulanıp uygulanmayacağı ve cp_net (yapı mühendisi ve onaylı kuruluş karar verir)

  - K9''dan panel/gün hacmi

  - 60364-7-712:2025 baskısında 712.414''ün değişip değişmediği

  - HS cam dayanımı ve çerçevesiz kelepçe katsayısı

  - Küçük hacimde Türkiye''ye teslim fiyatları (RFQ ile ölçülecek)'
