alan: kristal
ozet: '1) Revizyonun ana bulgusu kristal adiminin ekonomisi. Hazir n-tipi 182 mm/130 um wafer 0.148 USD/adet, yani
  ~4.5 USD/m2 (0.019 USD/W @%24; InfoLink 2026-09-23). Bizim ingot donusum + poly maliyetimiz dilimleme HARIC 120
  mm''de 12-25 USD/m2, 260 mm''de 7-16 USD/m2 (1.6-5.6 kat). Poly->ingot adimi ancak stratejik gerekceyle savunulabilir
  (mense/gumruk, tedarik guvenligi, Cin fiyatlarinin geri donmesi). Bu gerekceler BILINMIYOR ve sayilarla yazilmali.
  K3''teki ''satin alinan wafer'' asamasi gecici degil kalici bir secenek olarak modelde tutulmali.

  2) Ikinci yapisal sorun bolunmezlik. K9 (150 bin pil hucresi/yil) ve hucre formatina gore unite ingot talebi 1-360
  kg/gun araliginda. Bir 120 mm firin ise 27-31 kg/gun uretir. Silindirik kucuk formatlarda kullanim %4-70''e duser
  ve USD/kg 1.3-13 kat artar. Firin unite degil SAHA varligi olmali.

  3) Cekme hizi: v_max ~ D^-0.5 yalnizca teoriden geliyor (Plummer); TI 1977 ve Kayex 1979 yalnizca pratik orani
  (f_v) kalibre ediyor. Ceketsiz f_v = 0.36 (TI, Kayex, DOE); su sogutmali ceketin kazanci 1.0-2.0 kat arasinda
  BILINMIYOR; baz f_v = 0.45. Kucuk capta hiz tavani ~3 mm/dk (TI: 7.6 cm, helyum, 17-18 cm/h).

  4) Revize RCz sonuclari, bicim ''baz (mod degerleri) / MC medyan [P10-P90]'':

  - 120 mm: 31 / 27 [20-35] kg/gun; 22 / 29 [21-47] kWh/kg; 15 / 26 [18-37] USD/kg.

  - 210 mm: 86 / 81 [62-103] kg/gun; 15.6 / 18.7 [13-27] kWh/kg; 8.1 / 12.6 [9-17] USD/kg.

  - 80 mm zayif: medyan 11 kg/gun, 51 kWh/kg, 53 USD/kg.

  Ogrenme yilinda (ZD 0.3-0.7) kg/gun yariya iner, USD/kg yaklasik iki katina cikar. Kucuk capta en buyuk maliyet
  kalemi, kucuk unite icin gercekci alinan iscilik (0.5 h/h).

  5) Enerji: Temiz kecenin malzeme k''si 0.10-0.14 W/mK (SGL grafiginin vektor verisinden sayisallastirildi). Modeldeki
  etkin 0.5 W/mK, buyuk firin kalibrasyonunun gizledigi kayiplari (derz, SiO bozunmasi, gecisler) toplayan bir carpan:
  3.8 (1.5-8). Model 290 mm''de 15 [12-25] kWh/kg veriyor; bu IEA 13.5 ile CPIA 22.3 arasina dusuyor. TI 1977''nin
  12 cm''de olctugu 45 kW, ancak kalkansiz ve ince izolasyonlu eski bir sicak bolge varsayimiyla yeniden uretilebiliyor.
  Modern kucuk sicak bolgenin 2-3 kat daha az guc cekecegi bir VARSAYIMDIR. H5 testi: idealize olcekte kWh/kg captan
  neredeyse bagimsiz (4.9-8.8); kucuk capin cezasi sabit yuklerden ve olu sureden geliyor.

  6) Iki model duzeltmesi yapildi:

  - Guc kaynagi bagimsiz bir tasarim degiskeni oldu (TI: 80 kW ergitme / 45 kW tutma = 1.78).

  - Olu sure yeniden ayristirildi, cunku Kayex''in resarj suresi ergitmeyi de iceriyor. 120 mm''de ingot basina
  govde disi sure 7.1 h (yan besleyiciyle ~5 h).

  7) HJT kalitesi:

  - TaiyangNews (Haziran 2026): HJT yuksek oksijene toleransli ve gettering taklidi tav artik standart. K2''deki
  ''<250 C'' ilkesi endustri pratigiyle uyusmuyor; wafer on-tavi varsayilan olarak acik olmali. MCZ onceligi dustu.

  - Asil kalite riskleri metal ve karbon. Metal: dogal kuvars potadan gelen aki, kampanya sonunda Fe ~1e10-1e11
  cm-3 (kaba hesap). Karbon: k=0.07; yalnizca beslemeden n=16''da kuyruk konsantrasyonu 2 kat; sicak bolgeden gelen
  CO akisi bilinmiyor.

  - 10N beslemeden gelen metal kampanyayi sinirlamaz.

  8) CCz kg/gunu yalnizca kucuk capta artiriyor: 80 mm''de +%50, 120 mm''de +%12, 160 mm ve ustunde fark yok ya
  da negatif. n-tipinde O ve metal cezasi var (TaiyangNews 2025). RCz ana yol olmali, CCz deney olarak kalmali.

  9) FZ: 100-160 mm''de 48-81 kg/gun ile rekabetci; 24-25 kWh/kg''a besleme cubugu eklenir. ~3 MHz''de, bobin gerilimi
  ~500 V mertebesinde calisir. Firmanin kHz induksiyon yetkinligine FZ''den daha uygun bir secenek var: ~1 atm''de
  induksiyonla susseptor isitmali Cz (TI 1977 kucuk RF cekicide dislokasyonsuz kristal buyuttu).

  10) En buyuk belirsizlikler: kucuk sicak bolgenin tutma gucu, ceketin hiz etkisi, ZD ogrenme egrisi, potadan metal
  ve karbon akisi, capex ve NRE. Hepsi ancak prototip cekici ve 2B isil simulasyonla ogrenilir.'
