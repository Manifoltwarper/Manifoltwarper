    sicak yuzu isiticiyi gorur. 120 mm''de ic yuzeyden gecen aki ~6.3 kW/m2; isinim katsayisiyla (eps ~0.8) isitici-kece
    farki ~5 K, yani sicak yuz sicakligi isitici sicakligina yakin. Isitici-eriyik farki: eriyige giren 4-8 kW islak
    pota yuzeyinden (~0.33 m2) gecer; 10 mm kuvarsta (k ~2 W/mK, varsayim) 60-120 K, isinim boslugunda 15-30 K dusum
    olur. Buna gore isitici ~1770-1870 K. 1873 K (1600 C = T_m + 186 K) bu bandin ust ucunda, yani muhafazakar.
    Formul ayni sicak yuz sicakligini tum yan yuzeye ve ust/alt izolasyona uyguluyor; kalkan civari ve taban daha
