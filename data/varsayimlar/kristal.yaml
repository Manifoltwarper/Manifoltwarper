    (TI ve Kayex neredeyse ayni capta, 12 ve 13.3 cm). Bu bir UST SINIR referansidir.
  aciklama: v = (1/(rho_s*L))*sqrt(2*sigma*eps*k_m*T_m^5/(3r)); eps=0.55, k_m=22 ile 150 mm'de 4.16 mm/dk verir
