- id: cz_t_cool_per_mm_h
  ad: Sogutma suresinin capla artan kismi
  birim: h/mm
  deger: 0.005
  alt: 0.003
  ust: 0.01
  kaynak: Isinimla soguma ~D
  kaynak_turu: tahmin
  kaynak_alintisi: ''
  kaynak_tarihi: '-'
  guven: dusuk
  maliyet_sinifi: teknik
  olcek: unite
  senaryoya_uygunluk: ''
  aciklama: 'Dayanak: toplu (lumped) isinim sogumasi kaba hesabi (bu gorevde, hesap_turetilmis) ve TI 1977''nin
    tek olcumu. Olcum bu dayanakla celisiyor. TI olcumu: 12 cm kristalin ust haznede sogumasi ''averaged 1.9 h for
    crystals 12-32(A) and 12-32(B)''; argon jeti yok, rapor argon jetleriyle kisaltilabilecegini yaziyor. Model:
    0.5 (cz_t_cool_base_h) + 0.005*120 = 1.1 h, olcumun %42 altinda. Bu fark, argon jeti ya da su sogutmali alma
    odasiyla iyilesme VARSAYIMIDIR; dogrulanmadi. Toplu model: uzun silindir icin t = rho*cp*D/(4*eps*sigma) * (1/T2^3
    - 1/T1^3)/3, yani sure D ile dogrusal (rho 2329; cp ~900 J/kgK, ortalama tahmin; eps 0.6 tahmin; T1 1600 K).
    120 mm''de 1.1 h ~530-540 K''de, 1.9 h ~445-460 K''de almaya denk gelir (cevre 0-310 K). Baz surenin (0.5 h)
    kapsami tanimli degil. Yalnizca vana/kaldirma/basinclandirma ise isinim sogumasi 0.6 h surer (~645 K''de alma).
    Sogumanin parcasi ise toplam 1.1 h (~535 K). TI''nin kendi yari-surekli ekonomi plani da kristal basina ayri
    soguma yazmadan ''Unload 1.0'' h varsaymis (plan, olcum degil). Fizik denetcisinin ''120 mm icin ideal ~0.9
    h'' tahmini bagimsiz bir kontrol degil, cunku cz_t_cool_base_h ondan turetildi. Uyari: 1400 K''de Bi = h_rad*r/k
    ~0.9; toplu varsayim yuksek sicaklikta kaba. Buyuk capta isil gerilme sogutma hizini sinirlayabilir.'
  dogrulama_deneyi: Prototip.
