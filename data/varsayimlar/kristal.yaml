- id: cz_melt_depth_ratio
  ad: Eriyik derinligi / pota capi (RCz)
  birim: '-'
  deger: 0.55
  alt: 0.4
  ust: 0.7
  kaynak: Kaynak yok
  kaynak_turu: tahmin
  kaynak_alintisi: ''
  kaynak_tarihi: '-'
  guven: dusuk
  maliyet_sinifi: teknik
  olcek: unite
  senaryoya_uygunluk: ''
  aciklama: 'Dayanak: TI 1977 kucuk pota verisiyle capraz kontrol (bu gorevde, hesap_turetilmis); ayrik deger icin
    kaynak yok. Formulde sarj kutlesi rho_l*pi/4*D_cr^2*(0.55*D_cr)*0.85, burada rho_l = 2570 kg/m3 (sivi yogunluk).
    Veriyle yalnizca carpim sinanabiliyor: 0.55 x 0.85 = 0.4675. TI''da capi bilinen tek pota 12 kg''lik Varian
    potasi (''Varian 12-kg crucible has a radius of 12.3 cm''). D_cr = 0.246 m icin nominal 12 kg, carpim 0.40 demek.
    Ayni potayla yapilan tek sarjli kosularda (Tablo 1) sarj 10-12 kg, Ek G idealize guc egrisinde 11.6 kg; bunlar
    0.33-0.40 carpimina karsilik gelir. Model carpimi (0.4675) TI nominalinin %17, fiili alt ucun ~%40 ustunde.
    Ilk ciktida kullanilan 14.82 kg, TI''nin 18 kg''lik potali ekonomi planina ait; o potanin capi raporda verilmiyor
    ve bu pota icin gecerli degil. Dolayisiyla ''TI 0.40-0.49 bandini destekliyor'' iddiasi geri cekildi. Carpimin
    0.55 ile 0.85''e bolunusu yargi: gunes potalarinda yukseklik/cap ~0.6-0.7 (hafizadan, dogrulanmadi). TI potasinin
    yukseklik/capi bilinmiyor; modern potalar daha derinse carpim daha yuksek olabilir, ama bunun verisi yok. Kaynak
    denetcisinin bu parametre icin denedigi MDPI Crystals 11(3):264 sayfasi erisilemedi (403); deger oradan alinmis
    sayilamaz.'
  dogrulama_deneyi: CAD.
