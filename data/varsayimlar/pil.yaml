alan: pil
ozet: 'Kur varsayimi 6.72 CNY/USD (25.09.2026). Fiyatlar SMM 24.09.2026 tarihli.


  FIYAT (tum degerler ayni kaynaktan, SMM): Na-iyon/LFP primi formata gore -%14 ile +%59 arasinda degisiyor; tek
  bir ''Na %35-50 pahali'' sonucu gecersiz.

  - 50 Ah NFPP 0.08-0.09 $/Wh, 50 Ah LFP depolama hucresi 0.0565 -> +%50-59.

  - 100 Ah: +%54.

  - 10-28 Ah NFPP 0.073, 20-25 Ah LFP 0.072 -> +%1.

  - 25 Ah NFS kese 0.062 -> -%14.

  - Silindirik Na 0.080-0.085; SMM''de silindirik LFP satiri yok.

  Cin Eylul 2026''dan itibaren Li-iyona %2, Eylul 2027''den itibaren %4 tuketim vergisi uyguluyor; Na-iyon 2028
  sonuna kadar muaf (Mysteel, dogrulandi). Bu verginin ihracatta uygulanip uygulanmadigi dogrulanmadi. Ihracat KDV
  iadesinin kaldirilmasi da tum Cin hucrelerini pahalilastirir (oranlar dogrulanmadi).

  Gebze teslim tahmini: Na 26700 0.129 $/Wh (0.09-0.23), LFP 50 Ah 0.091 $/Wh (0.065-0.17).


  WH/WP ARTIK KULLANILABILIR ENERJI UZERINDEN TANIMLI: A 1.6, B 3.2 Wh/Wp.

  - Katmanli oksit (LO) 2.0 V kesimle nominal enerjinin ~%80''ini veriyor. Bu nedenle nominal oran A''da 2.0, B''de
  4.0 Wh/Wp.

  - NFPP ~0.9 kullanilabilir oranla 1.78 / 3.56 Wh/Wp.

  Yalniz hucre maliyeti (satin alma): LO A 0.26, B 0.52 $/W; LFP A 0.16 $/W.


  KUANTIZASYONLU TOPLAM PIL MALIYETI (26700, 14S, BMS haric; mekanik, iscilik, takim, sertifika ve garanti dahil):

  - A, tek panelli kutu: 50 W 1.31 / 100 W 0.92 / 200 W 0.59 / 300 W 0.57 / 500 W 0.45 $/W.

  - A, n=4: 0.59-0.38 $/W.

  - 50 W A kutusunda mekanik pay (0.67) hucreyi (0.37) asiyor; cok panelli kutu (K5) nicel olarak dogru.

  - 15S x 50 Ah prizmatik en az 2.14 kWh ediyor; ancak n*P >= ~1.2 kWp (A) oldugunda anlamli.


  KENDI HUCRE HATTI — sonuc formata bagli:

  (a) 26700 + K9 (150 bin hucre/yil ~1.4 MWh/yil): 1.03 $/Wh (0.51-1.89). Makineler bedava olsa bile 0.65 $/Wh.
  Satin almanin 5-8 kati; kesin olarak ekonomik degil.

  (b) 50 Ah prizmatik, K9 ile eslesen genis kaplama makinesi (5 M$, 144k hucre, ~17 MWh/yil, tam doluluk): 0.21
  $/Wh (0.11-0.70).

  - Na satin almaya gore 1.6 kat, LFP satin almaya gore 2.3 kat pahali.

  - Makineler firmada yapilirsa (2.5 M$, 12 FTE) 0.165 $/Wh, yani Na satin almanin 1.27 kati: belirsizlik icinde.

  - Kendi hat ancak su uc kosul birlikte saglanirsa kazanir: satin alma fiyati karamsar uca (>=~0.2 $/Wh) cikar,
  hat tam dolu calisir (>=17 MWh/yil) ve LFP kabul edilmez.

  Unite talebi kristal ve modul ajanlarinin ciktisina bagli (ornek 6-13 MWp/yil -> 11-52 MWh/yil). K9 26700 ile
  talebin 1/8-1/37''sini karsilar; 50 Ah ile yaklasik bir uniteye esit.

  Oneri: Faz 1''de hucre satin al, paketi (kalip, tutucu, kaynak, test) kendin yap. Faz 2''de RFQ ve gercek talep
  verisiyle prizmatik yolu yeniden hesapla.


  SOGUK HAVA:

  - Tycorun 26700: -10 C alti sarj yok; -10..0 C arasinda <0.2C sarj; -30..0 C arasinda desarj <=0.2C (dogrulandi).

  - EVLithium 210 Ah: -20..0 C arasinda <=0.2C sarj.

  - OGSolar NFPP 18650 ve 160 Ah: sarj en dusuk 0 C.

  - ''Na-iyon sogukta iyidir'' iddiasi ancak dusuk akimli desarj icin dogru. Bir 26700 kutusu 0 C altinda 0.2C ile
  sinirlanirsa, 430 Wh kutudan yalniz ~86 W cekilebilir.


  AB 2023/1542 (resmi metin dogrulandi):

  - Resital 15''e gore evde enerji depolayan piller, kutleden bagimsiz olarak endustriyel pildir; A senaryosundaki
  kutu buyuk olasilikla SBESS''tir.

  - SBESS icin Md. 12 (Ek V guvenlik testleri) ve Md. 14 (BMS''te saglik durumu (SOH) verisi) kapasite esigi olmadan
  uygulanir.

  - 2 kWh ustunde: Md. 10 (performans belgesi), Md. 7 (karbon ayak izi), Md. 77 (pil pasaportu, 18.02.2027).

  - ''Rated capacity'' ureticinin beyanidir. Esigin altinda kalinacaksa %10 pay birakilmali (<=1.8 kWh).

  - B senaryosunda 5 kg ve alti kutu tasinabilir pil sayilir; Md. 11 (son kullanici tarafindan cikarilabilirlik)
  18.02.2027''den itibaren gecerli.


  EN BUYUK BELIRSIZLIKLER: kucuk alicinin DDP fiyati ve MOQ; Turkiye ek gumruk vergisi (EGV) ve Cin ihracat KDV
  iadesi; hedef pazarin Wh/Wp orani; Na-iyonun kesime gore kullanilabilir enerjisi; takvim yaslanmasi.'
