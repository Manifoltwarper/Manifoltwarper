    bu parametreyle turetilmistir; model icinde ucret = aylik isveren maliyeti x 12 x eco_labor_overhead_factor
    / eco_productive_hours_fte_yr / eco_fx_try_per_usd olarak baglanmali ki tornado tutarli kalsin. Elektronigin
