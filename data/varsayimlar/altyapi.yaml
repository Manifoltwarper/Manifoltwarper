    belirler (gerekce duzeltildi). 8760/2070 = 4.23. Esdeger: tatilde calisilir ve prim odenirse 8760/2165 = 4.05
    FTE + ~%4 tatil primi = ~4.2. Alt sinir: gunduz vardiyasinda yasal fazla mesai kullanimi. | [Uzlaştırma/ekonomi]
