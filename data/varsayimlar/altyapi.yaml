  aciklama: '45*52 = 2340 - yillik izin 105-126 h - resmi tatil ~110 h (hafizadan, ~15.5 gun) - hastalik ~50 h =
    ~2060-2075. Tek deger 2070 (ilk ciktida ucrette 2100, FTE''de 2070 kullanilmisti). | [Uzlaştırma/ekonomi] Kanonik
