alan: altyapi
ozet: 'Bu alan iki sey saglar: (1) tum alanlarin kullanacagi ortak ekonomik girdiler, (2) saha altyapisinin unite
  sayisina (N) gore unitelere dagitilmasi. ORTAK GIRDILER (revize): Kur 49.0 TRY/USD (TCMB 25.09.2026: 48.79-48.88).
  USD bazli vergi sonrasi WACC %12 (aralik %9-20). Sermaye yuku artik vergi etkisiyle duzeltilmis CRF ile hesaplaniyor:
  CRF_tax = CRF*(1-t*PV_amortisman)/(1-t). t=%12.5 (2027''den imalat kazanci, sanayi sicil belgesi kosulu) ile makine
  (8 yil) 0.2122, altyapi (12 yil) 0.1726; bakim+sigorta ile yillik yuk faktoru 0.258 / 0.219. Elektrik iki rejimli:
  duzenlenmis OG tarifesi 0.084 USD/kWh yalnizca son kaynak tedarik tarifesi (SKTT) limitinin altinda gecerli; ustunde
  piyasa bazli (PTF+YEKDEM)*(1+marj)+dagitim = 0.107-0.114 USD/kWh. Baz 0.105 (aralik 0.084-0.14). SKTT limiti dogrulanamadi:
  kaynak sayfada ''15.000 kWh'' yaziyor, milyon kWh olabilir. Su: baz ortak aritmali OSB (ISU 4.22 USD/m3 + OSB
  atiksu bedeli ~1.0, tahmin) = 5.2 USD/m3; OSB disi 6.33. Iscilik (imalat 5 puan SGK tesvikiyle): operator 8.4,
  teknisyen 13.4, muhendis 12-35 USD/h. 24/7 bir pozisyonun maliyeti ~4.2 FTE esdegeri. Kira ~6.5 USD/m2/ay (tek
  ilan; guven dusuk). BULGU 1 (revize): Saha payi modul mimarisine bagli. (a) Sabit boyutlu modulleri asamali istiflemede
  unite basina yillik saha payi N=1/2/4/8/16 icin 706/370/247/194/165 kUSD. (b) Modulleri hedef N icin 0.6 kuraliyla
  bastan boyutlamada 617/350/207/139/99 kUSD. Ilk ciktidaki ''N=4 sonrasi ~116 kUSD taban'' sonucu fizikten degil
  mimari tercihinden geliyordu. Gercek buyume yolu (a) ile (b) arasinda kalir. Saha payina ek olarak unite-ici altyapi
  (VMB, gaz izleme, UPS, POU abatement, mini-ortam, sprinkler, HVAC, pil yangin bolmesi) ~0.9 MUSD capex / ~218
  kUSD/yil, unite kirasi da ~195 kUSD/yil. Ilk ciktidaki ''130 kUSD / 27 kUSD/yil'' eksikti. BULGU 2 (kosullu, guven
  orta): Yakma-islak abatement uniteler arasinda (saha basina) paylasilmamali; nedenleri SiO2 tozu, uzun hat ve
  yanici karisimin kanala girmemesi gerekliligi. SESHA''ya gore silan diger hidrurlerle tepkimez; yasak olan, oksitleyicilerle
  (NF3/F2, N2O, O2) karismasidir. NF3 kullanilirsa akislar kesin ayri tutulur. NF3''suz temizlikte ayni unitedeki
  yakin pompalar cok girisli bir POU''yu paylasabilir. BULGU 3: BEKRA/Seveso esikleri unite envanterinin cok ustunde:
  fosfin 0.2/1 t, P2 yanici gaz 10/50 t, H2 5/50 t. Baglayici olan kurallar: Binalarin Yangindan Korunmasi Yonetmeligi
  (md.105: tupler 120 dk yangina dayanikli ayri bina veya bolmede; md.96: parlayici madde bulunan ve 1000 m2''yi
  asan yapida sprinkler zorunlu; md.118 ve Ek-12/B: fabrika icinde yanici sivi en fazla 50 m2 tecritli alanda ve
  350 L/m2), ayrica ATEX, ISG ve desarj (SKKY Tablo 19: F- 15 mg/L). Turk yonetmeliginde IBC/IFC tipi ''kontrol
  alani azami miktari'' tablosu yok. BULGU 4: Su maliyeti ~0.046 USD/wafer (182 mm, 5000 wafer/gun, ortak aritmali
  OSB); OSB disinda 0.055. Bunun ~%38''i sabit tank tasmasindan gelir. BULGU 5 (revize): Ergiyigin kesintiye dayanma
  suresi (100 kg ergiyik, 60 kW kayip): donma baslangici ~0.5-2 dk, %20 katilasma ~10-12 dk, tam donma ~50 dk. ''10-15
  s jenerator'' bir dogal sinir degil; kampanya kaybi esigi dakikalar mertebesinde ve bilinmiyor. Daha sik ve pahali
  olabilecek kayip, gerilim cokmesinde ingotun yapisini kaybetmesi (hafizadan, dogrulanmadi). Bu yuzden UPS/DVR
  karari gerilim cokmesi sikligina, jenerator karari uzun kesinti sikligina baglandi. YENI KALEMLER: pil hatti ISG
  (elektrolit, formasyon yangini, NMP); tel testere ve alkali asindirma atiksuyu ile H2 uretimi (1 g Si -> 1.6 L
  H2); silan+H2 icin Le Chatelier seyreltmesi (1 slm SiH4 + 10 slm H2 icin ~1400 slm N2; bu yuzden seyreltme yerine
  yakma-islak); makine NRE''si, ogrenme egrisi, rampa ve isletme sermayesi. Saha payinin USD/W karsiligi artik wafer
  alanina bagli: 5000 wafer/gun ve N=1 (a) icin a=100 mm''de 0.177, 182 mm''de 0.053, 210 mm''de 0.040 USD/W. EN
  BUYUK BELIRSIZLIKLER: saha capex kalemlerinin cogu tahmin (x0.5-x2); elektrik rejimi ve PTF yillik ortalamasi;
  kucuk debide su ve atiksu hacmi; sebeke kesintisi ve gerilim cokmesi sikligi; kampanya kaybi esigi (kristal ajani).
  Not: fiyat, oran ve katsayi parametreleri ''teknik'' sinifinda; maliyet sinifi onlari kullanan formulde ataniyor.'
